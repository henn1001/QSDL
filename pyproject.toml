[project]
name = "QSDL"
dynamic = ["version"]
description = "A Schema-Definition-Language Generator inspired by GraphQl."
readme = "README.md"
authors = [{ name = "henn1001", email = "henn1001@outlook.com" }]
license = "Apache-2.0"
requires-python = ">=3.13"

dependencies = [
  "dacite==1.9.2",
  "flatten-json==0.1.14",
  "jinja2==3.1.6",
  "pathspec==1.1.1",
  "plantuml==0.3.0",
  "pyyaml==6.0.4",
  "textx==4.4.0",
  "typer==0.29.2",
]

[dependency-groups]
dev = [
  "openapi-spec-validator==0.9.0",
  "pytest-cov==7.1.0",
  "pytest-html==4.2.0",
  "pytest-order==1.5.0",
  "pytest-xdist==3.8.0",
  "pytest==9.2.0",
  "ruff==0.17.6",
]

[project.scripts]
qsdl = "qsdl.__main__:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
junit_family = "xunit2"
markers = ["integration: marks tests as integration tests"]
addopts = """
  --junitxml=dist/tests/report.xml
  --html=dist/tests/report.html
  --self-contained-html
  --cov=qsdl
  --cov-report=term
  --cov-report=html:dist/coverage
  -n auto
  --dist=loadscope
  -m 'not integration'
"""

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E", "F", "UP", "B", "SIM", "I", "ANN"]
ignore = ["E501"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]